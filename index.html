<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Tetris - Ultra Edition</title>
    <style>
        :root {
            --bg-color: #05050a;
            --panel-bg: rgba(15, 15, 30, 0.9);
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ff;
            --text-color: #e0e0ff;
        }
        body {
            background: radial-gradient(circle at center, #1a1a3a 0%, #05050a 100%);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            display: flex;
            gap: 25px;
            padding: 30px;
            background: var(--panel-bg);
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 60px rgba(0, 243, 255, 0.3), inset 0 0 20px rgba(0, 243, 255, 0.1);
            border-radius: 15px;
            animation: pulse 4s infinite alternate;
        }
        @keyframes pulse {
            from { box-shadow: 0 0 40px rgba(0, 243, 255, 0.2); }
            to { box-shadow: 0 0 70px rgba(0, 243, 255, 0.4); }
        }
        canvas {
            background: #000;
            border: 1px solid #333;
            display: block;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.9);
        }
        #hud {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-width: 160px;
        }
        .stat-box {
            margin-bottom: 20px;
            padding: 15px;
            border-left: 3px solid var(--neon-pink);
            background: rgba(255, 0, 255, 0.08);
            border-radius: 4px;
        }
        .stat-label { font-size: 0.7rem; text-transform: uppercase; color: #888; letter-spacing: 1px; }
        .stat-value { font-size: 1.6rem; font-weight: bold; font-family: monospace; color: var(--neon-blue); }
        canvas.small {
            border: 1px solid #444;
            background: #05050a;
        }
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 8px;
        }
        h1 { color: var(--neon-blue); text-shadow: 0 0 20px var(--neon-blue); margin-bottom: 20px; font-size: 3.5rem; }
        button {
            padding: 18px 45px;
            font-size: 1.3rem;
            background: transparent;
            color: var(--neon-pink);
            border: 2px solid var(--neon-pink);
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 2px;
        }
        button:hover { background: var(--neon-pink); color: white; box-shadow: 0 0 25px var(--neon-pink); }
        #controls-guide { font-size: 0.8rem; color: #666; margin-top: 30px; line-height: 1.8; text-align: center; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="tetris" width="300" height="600"></canvas>
    
    <div id="hud">
        <div>
            <div class="stat-box"><div class="stat-label">Score</div><div id="score" class="stat-value">0</div></div>
            <div class="stat-box"><div class="stat-label">Level</div><div id="level" class="stat-value">1</div></div>
            <div class="stat-box"><div class="stat-label">Lines</div><div id="lines" class="stat-value">0</div></div>
        </div>

        <div>
            <div class="stat-label">Hold (Shift/C)</div>
            <canvas id="hold" width="100" height="200" class="small"></canvas>
        </div>

        <div>
            <div class="stat-label">Next</div>
            <canvas id="next" width="100" height="200" class.small"></canvas>
        </div>

    <div id="start-screen" class="overlay">
        <h1>CYBER TETRIS</h1>
        <button id="start-btn">Initialize</button>
        <div id="controls-guide">
            ARROWS / W : MOVE & ROTATE<br>
            SPACE : HARD DROP (ACCELERATION)<br>
            SHIFT / C : HOLD PIECE<br>
            P / ESC : PAUSE
        </div>
    </div>

    <div id="pause-screen" class="overlay hidden">
        <h1>PAUSED</h1>
        <button id="resume-btn">Resume</button>
    </div>

    <div id="game-over-screen" class="overlay hidden">
        <h1 style="color: var(--neon-pink); text-shadow: 0 0 20px var(--neon-pink);">SYSTEM FAILURE</h1>
        <div class="stat-box"><div id="final-score" class.stat-value">0</div></div>
        <button id="restart-btn">Reboot</button>
    </div>
</div>

<script>
const canvas = document.getElementById('tetris');
const context = canvas.getContext('2d');
const nextCanvas = document.getElementById('next');
const nCtx = nextCanvas.getContext('2d');
const holdCanvas = document.getElementById('hold');
const hCtx = holdCanvas.getContext('2d');

const ROW = 20;
const COL = 10;
const BLOCK_SIZE = 30;

context.scale(BLOCK_SIZE, BLOCK_SIZE);
nCtx.scale(25, 25);
hCtx.scale(25, 25);

const COLORS = [null, '#FF0D72', '#0DC2FF', '#0DFF72', '#F538FF', '#FF8E0D', '#FFE138', '#3877FF'];

// --- AUDIO ENGINE (Cyberpunk Style) ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let musicInterval;

function playSound(freq, type, duration, volume = 0.1) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + duration);
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

// Specific SFX functions
function playRotateSound() {
    playSound(880, 'sine', 0.1, 0.05); // High "blip"
}

function playSoftDropSound() {
    playSound(220, 'square', 0.1, 0.03); // Dull "thud"
}

function playHardDropSound() {
    playSound(110, 'sawtooth', 0.2, 0.08); // Heavy impact
}

function playLineClearSound() {
    const notes = [440, 554, 659, 880];
    notes.forEach((f, i) => {
        setTimeout(() => playSound(f, 'sine', 0.2, 0.05), i * 50);
    });
}

const tetrisThemeTypeB = [
    { pitch: 'E4', duration: 0.4 }, { pitch: 'G4', duration: 0.4 }, { pitch: 'C5', duration: 0.8 },
    { pitch: 'B4', duration: 0.4 }, { pitch: 'A4', duration: 0.4 }, { pitch: 'G4', duration: 0.8 },
    { pitch: 'A4', duration: 0.4 }, { pitch: 'F4', duration: 0.4 }, { pitch: 'A4', duration: 0.8 },
    { pitch: 'G4', duration: 0.4 }, { pitch: 'E4', duration: 0.4 }, { pitch: 'G4', duration: 0.8 },
    { pitch: 'F4', duration: 0.4 }, { pitch: 'D4', duration: 0.4 }, { pitch: 'F4', duration: 0.4 }, { pitch: 'A4', duration: 0.4 },
    { pitch: 'G4', duration: 0.4 }, { pitch: 'F4', duration: 0.4 }, { pitch: 'E4', duration: 1.2 },
    { pitch: 'D4', duration: 0.4 }, { pitch: 'E4', duration: 0.4 }, { pitch: 'F4', duration: 0.8 },
    { pitch: 'D4', duration: 0.4 }, { pitch: 'B3', duration: 0.4 }, { pitch: 'C4', duration: 1.2 },
    { pitch: 'REST', duration: 0.5 }
];

const freqMap = {
    'A3': 220, 'B3': 246.94, 'C4': 261.63, 'D4': 293.66, 'E4': 329.63, 'F4': 349.23, 'G4': 392.00,
    'A4': 440, 'B4': 493.88, 'C5': 523.25, 'D5': 587.33, 'E5': 659.25, 'F5': 698.46, 'G5': 783.99, 'A5': 880
};

function startMusic() {
    if (musicInterval) clearInterval(musicInterval);
    let step = 0;
    musicInterval = setInterval(() => {
        const note = tetrisThemeTypeB[step % tetrisThemeTypeB.length];
        if (note.pitch !== 'REST') {
            playSound(freqMap[note.pitch], 'triangle', note.duration, 0.06);
        }
        step++;
    }, 320); // Slightly faster tempo for more energy
}

// --- GAME LOGIC ---
function createPiece(type) {
    if (type === 'I') return [[0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0]];
    if (type === 'L') return [[0, 2, 0], [0, 2, 0], [0, 2, 2]];
    if (type === 'J') return [[0, 3, 0], [0, 3, 0], [3, 3, 0]];
    if (type === 'O') return [[4, 4], [4, 4]];
    if (type === 'Z') return [[5, 5, 0], [0, 5, 5], [0, 0, 0]];
    if (type === 'S') return [[0, 6, 6], [6, 6, 0], [0, 0, 0]];
    if (type === 'T') return [[0, 7, 0], [7, 7, 7], [0, 0, 0]];
}

function createMatrix(w, h) {
    const matrix = [];
    while (h--) matrix.push(new Array(w).fill(0));
    return matrix;
}

let particles = [];
function createExplosion(x, y) {
    for (let i = 0; i < 15; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 0.6,
            vy: (Math.random() - 0.5) * 0.6,
            life: 1.0,
            color: COLORS[Math.floor(Math.random() * 7)]
        });
    }
}

function getGhostPosition() {
    let ghostPos = { ...player.pos };
    while (!collide(matrix, { x: ghostPos.x, y: ghostPos.y + 1 })) {
        ghostPos.y++;
    }
    return ghostPos;
}

function drawGhostPiece(piece, pos) {
    piece.forEach((row, y) => {
        row.forEach((value, x) => {
            if (value !== 0) {
                context.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                context.lineWidth = 0.02;
                context.strokeRect(x + pos.x, y + pos.y, 0.95, 0.95);
            }
        });
    });
}

function draw() {
    context.fillStyle = '#000';
    context.fillRect(0, 0, canvas.width, canvas.height);
    
    drawMatrix(matrix, {x: 0, y: 0});
    
    // Ghost Piece (Highlight landing area with line)
    const ghostPos = getGhostPosition();
    drawGhostPiece(player.piece, ghostPos);

    // Trail Rendering with Alpha Decay
    if (player.trail) {
        for (let i = player.trail.length - 1; i >= 0; i--) {
            const t = player.trail[i];
            t.alpha -= 0.02; // Fade out over ~50 frames (~0.8s at 60fps)
            if (t.alpha <= 0) {
                player.trail.splice(i, 1);
            } else {
                context.globalAlpha = t.alpha;
                drawPiece(player.piece, {x: player.pos.x, y: t.y});
            }
        }
        context.globalAlpha = 1.0;
    }

    drawPiece(player.piece, player.pos);
    
    particles.forEach((p, i) => {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.02;
        context.fillStyle = p.color;
        context.globalAlpha = p.life;
        context.fillRect(p.x, p.y, 0.5, 0.5);
        if (p.life <= 0) particles.splice(i, 1);
    });
    context.globalAlpha = 1.0;
}

function drawMatrix(m, offset) {
    m.forEach((row, y) => {
        row.forEach((value, x) => {
            if (value !== 0) {
                const grad = context.createLinearGradient(x + offset.x, y + offset.y, x + offset.x, y + offset.y + 1);
                grad.addColorStop(0, COLORS[value]);
                grad.addColorStop(1, '#fff');
                context.fillStyle = grad;
                context.shadowBlur = 8;
                context.shadowColor = COLORS[value];
                context.fillRect(x + offset.x, y + offset.y, 0.95, 0.95);
                context.strokeStyle = 'rgba(255,255,255,0.1)';
                context.lineWidth = 0.02;
                context.strokeRect(x + offset.x, y + offset.y, 0.95, 0.95);
            }
        });
    });
    context.shadowBlur = 0;
}

function drawPiece(piece, pos) {
    piece.forEach((row, y) => {
        row.forEach((value, x) => {
            if (value !== 0) {
                const grad = context.createLinearGradient(x + pos.x, y + pos.y, x + pos.x, y + pos.y + 1);
                grad.addColorStop(0, COLORS[value]);
                grad.addColorStop(1, '#fff');
                context.fillStyle = grad;
                context.shadowBlur = 8;
                context.shadowColor = COLORS[value];
                context.fillRect(x + pos.x, y + pos.y, 0.95, 0.95);
                context.strokeStyle = 'rgba(255,255,255,0.1)';
                context.lineWidth = 0.02;
                context.strokeRect(x + pos.x, y + pos.y, 0.95, 0.95);
            }
        });
    });
    context.shadowBlur = 0;
}

function drawPreviews() {
    nCtx.fillStyle = '#05050a';
    nCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
    if (player.next) drawSmallMatrix(player.next, {x: 1, y: 1}, nCtx);

    hCtx.fillStyle = '#05050a';
    hCtx.fillRect(0, 0, holdCanvas.width, holdCanvas.height);
    if (player.hold) drawSmallMatrix(player.hold, {x: 1, y: 1}, hCtx);
}

function drawSmallMatrix(m, offset, ctx) {
    m.forEach((row, y) => {
        row.forEach((value, x) => {
            if (value !== 0) {
                ctx.fillStyle = COLORS[value];
                ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
                ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                ctx.lineWidth = 0.05;
                ctx.strokeRect(x + offset.x, y + offset.y, 1, 1);
            }
        });
    });
}

function collide(arena, pos) {
    const [m, o] = [player.piece, pos];
    for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
            if (m[y][x] !== 0) {
                const newY = y + o.y;
                const newX = x + o.x;
                // Check boundaries
                if (newY < 0 || newY >= ROW || newX < 0 || newX >= COL) {
                    return true;
                }
                // Collision check only if within bounds
                if (arena[newY] && arena[newY][newX] !== 0) {
                    return true;
                }
            }
        }
    }
    return false;
}

function merge(arena, pos) {
    player.piece.forEach((row, y) => {
        row.forEach((value, x) => {
            if (value !== 0) {
                arena[y + pos.y][x + pos.x] = value;
            }
        });
    });
}

function rotate(matrix, dir) {
    let newMatrix = matrix[0].map((_, i) => matrix.map(row => row[i]));
    if (dir > 0) return newMatrix.map(row => row.reverse());
    return newMatrix.map(row => [...row].reverse()).reverse();
}

function arenaSweep() {
    let rowCount = 0;
    for (let y = ROW - 1; y >= 0; --y) {
        if (matrix[y].every(cell => cell !== 0)) {
            // Identify blocks for explosion before removing
            matrix[y].forEach((val, x) => {
                if (val !== 0) createExplosion(x, y);
            });
            matrix.splice(y, 1);
            matrix.unshift(new Array(COL).fill(0));
            rowCount++;
        }
    }
    if (rowCount > 0) {
        player.score += rowCount * 100 * player.level;
        player.lines += rowCount;
        player.level = Math.floor((player.lines / 10) + 1);
        updateStats();
        playLineClearSound(); // New clear sound
        playExplosionSound();
    }
}

function updateStats() {
    document.getElementById('score').innerText = player.score;
    document.getElementById('level').innerText = player.level;
    document.getElementById('lines').innerText = player.lines;
}

function playerDrop() {
    player.trail = []; 
    player.pos.y++;
    if (collide(matrix, player.pos)) {
        player.pos.y--;
        merge(matrix, player.pos);
        player.reset();
        arenaSweep();
        updateStats();
        triggerShake(3); // Subtle shake for soft drop
        playSoftDropSound();
    }
    dropCounter = 0;
}

function playerMove(dir) {
    player.pos.x += dir;
    if (collide(matrix, player.pos)) {
        player.pos.x -= dir;
    }
}

function playerRotate(dir) {
    const pos = { ...player.pos };
    const oldPiece = player.piece;
    player.piece = rotate(player.piece, dir);
    
    if (collide(matrix, pos)) {
        // Wall Kick logic: try to shift the piece in 4 directions
        let shifted = false;
        const offsets = [
            {x: 1, y: 0}, {x: -1, y: 0}, {x: 0, y: 1}, {x: 0, y: -1}
        ];
        for (let offset of offsets) {
            if (!collide(matrix, {x: pos.x + offset.x, y: pos.y + offset.y})) {
                player.pos.x += offset.x;
                player.pos.y += offset.y;
                shifted = true;
                break;
            }
        }

        if (!shifted) {
            // If no shift works, revert rotation
            player.piece = oldPiece;
        } else {
            playRotateSound();
        }
    } else {
        playRotateSound();
    }
}

function playerHardDrop() {
    let targetY = player.pos.y;
    while (!collide(matrix, {x: player.pos.x, y: targetY + 1})) {
        targetY++;
    }
    
    const oldY = player.pos.y;
    if (targetY > oldY) {
        player.trail = [];
        for (let i = 1; i <= 4; i++) {
            player.trail.push({
                y: oldY + Math.floor((targetY - oldY) * (i / 5)),
                alpha: 1 - (i / 5)
            });
        }
    }

    player.pos.y = targetY;
    triggerShake(12); // Call immediately for better responsiveness

    setTimeout(() => {
        if (!paused && !isGameOver) {
            merge(matrix, player.pos);
            player.reset();
            arenaSweep();
            updateStats();
            playHardDropSound();
            triggerShake(12); // Strong shake for hard drop
        }
    }, 30);
}

function triggerShake(intensity = 3) {
    const container = document.getElementById('game-container');
    let currentIntensity = intensity;
    const interval = setInterval(() => {
        container.style.transform = `translate(${Math.random()*currentIntensity - currentIntensity/2}px, ${Math.random()*currentIntensity - currentIntensity/2}px)`;
        currentIntensity *= 0.85;
        if (currentIntensity < 1) clearInterval(interval);
    }, 16);
}

function playerHold() {
    if (player.hold) {
        const temp = player.piece;
        player.piece = player.hold;
        player.hold = null;
        player.pos = {x: Math.floor(COL/2), y: 0};
        if (collide(matrix, player.pos)) {
            player.piece = temp;
            player.hold = player.piece;
        }
    } else {
        player.hold = player.piece;
        player.reset();
    }
    drawPreviews();
}

const player = {
    pos: {x: 0, y: 0},
    piece: null,
    next: null,
    hold: null,
    trail: [],
    score: 0,
    level: 1,
    lines: 0,
    reset() {
        const pieces = 'ILJOTSZ';
        if (player.next === null) {
            player.next = createPiece(pieces[Math.floor(Math.random() * 7)]);
        }
        player.piece = player.next;
        player.next = createPiece(pieces[Math.floor(Math.random() * 7)]);
        player.pos = {x: Math.floor(COL/2), y: 0};
        player.trail = [];

        if (collide(matrix, player.pos)) {
            gameOver();
        }
        drawPreviews();
    }
};

let isGameOver = false;
function gameOver() {
    isGameOver = true;
    paused = true;
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('final-score').innerText = player.score;
}

let dropCounter = 0;
let dropInterval = 1000;
let lastTime = 0;
let paused = true;

const matrix = createMatrix(COL, ROW);

function update(time = 0) {
    if (paused || isGameOver) return;
    const deltaTime = time - lastTime;
    lastTime = time;

    dropCounter += deltaTime;
    let currentInterval = Math.max(100, dropInterval - (player.level * 50));
    
    if (dropCounter > currentInterval) {
        playerDrop();
    }

    draw();
    requestAnimationFrame(update);
}

function init() {
    matrix.forEach(row => row.fill(0));
    player.score = 0;
    player.level = 1;
    player.lines = 0;
    player.hold = null;
    player.next = createPiece('I');
    player.reset();
    updateStats();
    drawPreviews();
    paused = false;
    isGameOver = false;
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('pause-screen').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    update();
    startMusic();
}

window.addEventListener('keydown', event => {
    if (paused && event.key !== 'p' && event.key !== 'P' && event.key !== 'Escape') return;

    if (event.key === 'ArrowLeft' || event.key === 'a') playerMove(-1);
    else if (event.key === 'ArrowRight' || event.key === 'd') playerMove(1);
    else if (event.key === 'ArrowDown' || event.key === 's') {
        const oldY = player.pos.y;
        playerDrop();
        if (!collide(matrix, {x: player.pos.x, y: oldY})) {
            // Soft drop trail logic with alpha decay
            player.trail = [{y: oldY, alpha: 0.4}];
        }
    }
    else if (event.key === 'ArrowUp' || event.key === 'w') playerRotate(1);
    else if (event.key === ' ') {
        event.preventDefault();
        playerHardDrop();
    }
    else if (event.key === 'Shift' || event.key === 'c' || event.key === 'C') {
        playerHold();
    }
    else if (event.key === 'p' || event.key === 'P' || event.key === 'Escape') {
        paused = !paused;
        if (!paused) update();
        if (paused) {
            document.getElementById('pause-screen').classList.toggle('hidden', !paused);
        }
    }
});

document.getElementById('start-btn').addEventListener('click', init);
document.getElementById('resume-btn').addEventListener('click', () => {
    paused = false;
    document.getElementById('pause-screen').classList.add('hidden');
    update();
});
document.getElementById('restart-btn').addEventListener('click', init);

drawPreviews();
</script>
</body>
</html>
