<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050711">
  <meta name="description" content="Cyber Tetris — неоновая аркада в стиле Synthwave">
  <title>Загрузка — Cyber Tetris</title>
  <style>
    :root{color-scheme:dark;--cyan:#64efff;--orange:#ff995a;--violet:#9e79ff}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050711;color:#e9faff;font-family:Inter,"Segoe UI",system-ui,sans-serif}
    body{display:grid;place-items:center;min-height:100dvh;isolation:isolate}
    .splash-bg{position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse at 50% 36%,rgba(35,74,126,.42),transparent 52%),radial-gradient(ellipse at 50% 100%,rgba(105,31,89,.28),transparent 56%),linear-gradient(155deg,#101a34 0%,#080d21 48%,#120b20 100%)}
    .splash-bg::before,.splash-bg::after{content:"";position:absolute;inset:0;pointer-events:none}
    .splash-bg::before{opacity:.34;background:linear-gradient(180deg,transparent 52%,rgba(45,217,255,.08) 52.2%,transparent 52.6%),repeating-linear-gradient(90deg,transparent 0 54px,rgba(73,204,255,.055) 55px,transparent 56px),repeating-linear-gradient(0deg,transparent 0 34px,rgba(73,204,255,.035) 35px,transparent 36px);mask-image:linear-gradient(180deg,transparent 35%,#000 100%)}
    .splash-bg::after{background:radial-gradient(ellipse at center,transparent 15%,rgba(0,0,0,.4) 100%)}
    .loader-card{position:relative;width:min(430px,calc(100vw - 38px));padding:32px 28px 25px;border:1px solid transparent;border-radius:24px;background:linear-gradient(145deg,rgba(19,38,70,.94),rgba(5,11,28,.97) 55%,rgba(22,13,37,.96)) padding-box,linear-gradient(125deg,rgba(95,241,255,.92),rgba(66,128,219,.4) 33%,rgba(255,150,89,.78) 70%,rgba(163,118,255,.58)) border-box;box-shadow:0 28px 75px rgba(0,0,0,.55),0 0 34px rgba(48,206,255,.15),inset 0 1px 0 rgba(255,255,255,.16);text-align:center;overflow:hidden;transform:translateZ(0)}
    .loader-card::before{content:"";position:absolute;inset:7px;border:1px solid rgba(108,222,255,.15);border-radius:17px;pointer-events:none}
    .brand-kicker{color:rgba(169,224,245,.72);font-size:9px;font-weight:900;letter-spacing:.35em;text-transform:uppercase}
    h1{margin:12px 0 4px;font-size:clamp(27px,8vw,40px);line-height:1;font-weight:1000;letter-spacing:.08em;color:#f4fcff;text-shadow:0 0 12px rgba(72,235,255,.66),0 5px 20px rgba(0,0,0,.58)}
    .brand-sub{color:#ffb17c;font-size:10px;font-weight:900;letter-spacing:.27em}
    .loader-orb{width:64px;height:64px;margin:24px auto 17px;position:relative;border-radius:50%;background:radial-gradient(circle at 36% 32%,#fff3cc 0 4%,#ffb56e 15%,#f34d66 48%,#8b2d79 72%,transparent 73%);box-shadow:0 0 14px rgba(255,106,80,.55),0 0 44px rgba(255,97,77,.25);animation:orbPulse 2.5s ease-in-out infinite}
    .loader-orb::before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-linear-gradient(180deg,transparent 0 8px,rgba(8,9,26,.78) 8px 11px);mask-image:linear-gradient(180deg,transparent 0%,#000 28%,#000 100%)}
    .loader-orb::after{content:"";position:absolute;inset:-11px;border:1px solid rgba(95,223,255,.36);border-radius:50%;box-shadow:0 0 17px rgba(78,223,255,.18);animation:orbRing 6s linear infinite}
    .loading-title{font-size:11px;font-weight:950;letter-spacing:.22em;color:#dffaff}
    .loading-caption{min-height:17px;margin-top:7px;color:rgba(175,206,227,.68);font-size:10px;letter-spacing:.08em}
    .meter{height:7px;margin:20px 2px 9px;position:relative;overflow:hidden;border-radius:12px;background:rgba(2,7,20,.85);border:1px solid rgba(112,205,237,.22);box-shadow:inset 0 2px 5px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.05)}
    .meter-fill{width:7%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#3bcce8,#87f3ff 45%,#ffb16e 82%,#ff7956);box-shadow:0 0 12px rgba(78,229,255,.62);transition:width .35s cubic-bezier(.2,.75,.2,1);position:relative}
    .meter-fill::after{content:"";position:absolute;inset:0;width:42%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.78),transparent);animation:meterShine 1.4s ease-in-out infinite}
    .loading-foot{display:flex;justify-content:space-between;gap:10px;color:rgba(138,176,206,.65);font-size:8px;font-weight:850;letter-spacing:.14em}
    .loader-corners{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,var(--cyan),transparent) left 19px top 18px/28px 1px no-repeat,linear-gradient(180deg,var(--cyan),transparent) left 18px top 19px/1px 28px no-repeat,linear-gradient(270deg,var(--orange),transparent) right 19px bottom 18px/28px 1px no-repeat,linear-gradient(0deg,var(--orange),transparent) right 18px bottom 19px/1px 28px no-repeat}
    #game-frame{position:fixed;inset:0;width:100%;height:100%;border:0;opacity:0;visibility:hidden;pointer-events:none;background:#050711;transition:opacity .42s ease;z-index:4}
    body.game-ready #game-frame{opacity:1;visibility:visible;pointer-events:auto}
    body.game-ready .loader-card{opacity:0;transform:translateY(-8px) scale(.985);transition:opacity .35s ease,transform .35s ease;pointer-events:none}
    body.game-ready .splash-bg{opacity:0;transition:opacity .45s ease}
    .load-error{display:none;margin:13px auto 0;color:#ffb6a7;font-size:10px;line-height:1.5}
    #boot-debug{display:none;position:fixed;z-index:9;left:10px;right:10px;bottom:10px;max-height:24vh;overflow:auto;padding:8px 10px;border:1px solid rgba(100,230,255,.25);border-radius:9px;background:rgba(0,5,15,.78);color:#aeefff;font:10px/1.45 monospace;text-align:left;white-space:pre-wrap;pointer-events:none}
    .retry{display:none;margin:10px auto 0;min-height:38px;padding:0 19px;border:1px solid rgba(255,170,119,.72);border-bottom:3px solid #81391f;border-radius:11px;background:linear-gradient(180deg,#ffbd7c,#e85d3b);color:#23111b;font-weight:950;letter-spacing:.1em}
    .loader-actions{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:12px}
    .loader-action{min-height:36px;padding:0 13px;border:1px solid rgba(100,230,255,.48);border-radius:10px;background:rgba(13,35,58,.88);color:#bdf7ff;font-size:9px;font-weight:900;letter-spacing:.08em}
    .loader-action:active{transform:translateY(1px);filter:brightness(1.2)}
    .load-failed .load-error,.load-failed .retry{display:block}
    @keyframes orbPulse{0%,100%{transform:scale(1);filter:brightness(.96)}50%{transform:scale(1.08);filter:brightness(1.17)}}
    @keyframes orbRing{to{transform:rotate(360deg)}}
    @keyframes meterShine{0%{transform:translateX(-130%)}100%{transform:translateX(290%)}}
    @media(prefers-reduced-motion:reduce){.loader-orb,.loader-orb::after,.meter-fill::after{animation:none!important}.meter-fill{transition:none}}
    body.debug-mode .loader-card,body.debug-mode .splash-bg{display:none!important}
    body.debug-mode #game-frame{opacity:1!important;visibility:visible!important;pointer-events:auto!important;z-index:10}
    body.debug-mode #boot-debug{display:block!important;z-index:20;bottom:8px;max-height:32vh}
  </style>
</head>
<body>
  <div class="splash-bg" aria-hidden="true"></div>
  <main class="loader-card" id="loader-card" role="status" aria-live="polite">
    <div class="loader-corners" aria-hidden="true"></div>
    <div class="brand-kicker">Nikita Markin presents</div>
    <h1>CYBER TETRIS</h1>
    <div class="brand-sub">SYNTHWAVE ARCADE</div>
    <div class="loader-orb" aria-hidden="true"></div>
    <div class="loading-title">ПОДОЖДИТЕ, ЗАГРУЖАЕМ ИГРУ</div>
    <div class="loading-caption" id="loading-caption">Подключаем игровое ядро и графические ресурсы…</div>
    <div class="meter" role="progressbar" aria-label="Загрузка игры" aria-valuemin="0" aria-valuemax="100" aria-valuenow="7"><div class="meter-fill" id="meter-fill"></div></div>
    <div class="loading-foot"><span id="loading-stage">ИНИЦИАЛИЗАЦИЯ</span><span id="loading-percent">07%</span></div>
    <div class="load-error" id="load-error">Не удалось загрузить игровые ресурсы. Проверьте соединение и попробуйте ещё раз.</div>
    <button class="retry" id="retry-btn" type="button">ПОВТОРИТЬ ЗАГРУЗКУ</button>
    <div class="loader-actions"><button class="loader-action" id="refresh-page-btn" type="button">ОБНОВИТЬ ИГРУ</button><button class="loader-action" id="copy-log-btn" type="button">СКОПИРОВАТЬ ЛОГ</button></div>
  </main>
  <pre id="boot-debug" style="display:none;position:fixed!important;left:8px!important;right:8px!important;top:48px!important;bottom:auto!important;max-height:34vh!important;overflow:auto!important;z-index:2147483647!important;margin:0!important;padding:10px!important;background:rgba(0,5,15,.96)!important;color:#aeefff!important;border:1px solid #38cdb0!important;border-radius:8px!important;font:11px/1.45 monospace!important;white-space:pre-wrap!important;pointer-events:auto!important">DEBUG BOOT: ожидание iframe…</pre>
  <button id="copy-log-persistent" type="button" style="display:none;position:fixed;right:8px;top:8px;z-index:100000;padding:8px 10px;background:#07131f;color:#aeefff;border:1px solid #38cdb0;border-radius:6px;font:11px monospace">COPY BOOT LOG</button>
  <script>
    // Independent emergency diagnostics: runs before the game iframe and main loader.
    (() => {
      // Diagnostics are enabled by default on main; no query parameters required.
      const panel = document.getElementById('boot-debug');
      panel.style.cssText = 'display:block!important;position:fixed!important;left:8px!important;right:8px!important;top:48px!important;bottom:auto!important;max-height:38vh!important;overflow:auto!important;z-index:2147483647!important;margin:0!important;padding:10px!important;background:rgba(0,5,15,.98)!important;color:#aeefff!important;border:2px solid #38cdb0!important;border-radius:8px!important;font:12px/1.5 monospace!important;white-space:pre-wrap!important;pointer-events:auto!important';
      const lines = ['CYBER TETRIS DIAGNOSTICS — ALWAYS ON', 'URL: ' + location.href, 'Document: ' + document.readyState];
      const render = () => { panel.textContent = lines.slice(-30).join('\\n'); };
      window.__bootDiag = message => { lines.push(new Date().toLocaleTimeString() + ' ' + message); render(); };
      window.addEventListener('error', e => window.__bootDiag('WINDOW ERROR: ' + (e.message || e.type)));
      window.addEventListener('unhandledrejection', e => window.__bootDiag('PROMISE ERROR: ' + String(e.reason)));
      window.addEventListener('load', () => window.__bootDiag('WINDOW LOAD'));
      window.__bootDiag('EARLY SCRIPT EXECUTED');
      document.addEventListener('DOMContentLoaded', () => {
        const frame = document.getElementById('game-frame');
        window.__bootDiag('DOM READY; iframe=' + (!!frame) + (frame ? '; src=' + frame.src : ''));
        if (frame) {
          frame.addEventListener('load', () => window.__bootDiag('IFRAME LOAD EVENT'));
          frame.addEventListener('error', () => window.__bootDiag('IFRAME ERROR EVENT'));
        }
      });
      setInterval(() => {
        const frame = document.getElementById('game-frame');
        let state = 'not-created';
        try { state = frame ? (frame.contentDocument ? frame.contentDocument.readyState : 'cross-origin/unavailable') : state; } catch (_) { state = 'cross-origin'; }
        window.__bootDiag('HEARTBEAT; page=' + document.readyState + '; iframe=' + state);
      }, 3000);
    })();
  </script>
  <iframe id="game-frame" src="./game.html?v=15.1.4-independent-diag" title="Cyber Tetris — игра" allow="autoplay; fullscreen" allowfullscreen></iframe>
  <noscript><p style="position:fixed;z-index:10;top:50%;left:10%;right:10%;text-align:center">Для запуска Cyber Tetris необходимо включить JavaScript.</p></noscript>
  <script>
    (()=>{
      const frame=document.getElementById('game-frame');
      const fill=document.getElementById('meter-fill');
      const percent=document.getElementById('loading-percent');
      const caption=document.getElementById('loading-caption');
      const stage=document.getElementById('loading-stage');
      const meter=document.querySelector('.meter');
      let progress=7, frameLoaded=false, ready=false, slowTimer=0;
      const debugBox=document.getElementById('boot-debug');let debugLines=[];const dbg=(msg)=>{debugLines.push(new Date().toLocaleTimeString()+' '+msg);if(debugLines.length>12)debugLines.shift();const logText=debugLines.join('\n');debugBox.textContent=logText;};const perfMode=new URLSearchParams(location.search).get('perf')==='1';if(perfMode){document.body.classList.add('debug-mode');document.getElementById('boot-debug').style.display='block';document.getElementById('copy-log-persistent').style.display='block';const gameUrl=new URL(frame.src,location.href);gameUrl.searchParams.set('perf','1');gameUrl.searchParams.set('diagReload',Date.now());frame.src=gameUrl.toString();}dbg('loader script started');
      const setProgress=(value,label)=>{
        progress=Math.max(progress,Math.min(99,Math.round(value)));
        fill.style.width=progress+'%';percent.textContent=String(progress).padStart(2,'0')+'%';
        meter.setAttribute('aria-valuenow',String(progress));
        if(label)caption.textContent=label;
        stage.textContent=progress<25?'ИНИЦИАЛИЗАЦИЯ':progress<55?'ЗАГРУЗКА МИРА':progress<82?'ГРАФИКА И ЭФФЕКТЫ':'ЗАПУСК АРКАДЫ';
        maybeReveal();
      };
      window.addEventListener('message',event=>{
        if(event.origin!==location.origin || event.source!==frame.contentWindow) return;
        const data=event.data;
        if(!data)return;
        if(data.type==='CYBER_TETRIS_DEBUG'){dbg(data.message||'game debug');return;}
        if(data.type!=='CYBER_TETRIS_BOOT')return;
        dbg('game progress '+data.progress+'% · '+data.label);
        setProgress(data.progress,data.label);
      });
      function reveal(){
        if(ready)return;ready=true;clearTimeout(slowTimer);
        document.body.classList.remove('load-failed');
        fill.style.width='100%';percent.textContent='100%';meter.setAttribute('aria-valuenow','100');
        caption.textContent='МИР ГОТОВ. УДАЧНОЙ ИГРЫ!';stage.textContent='СИСТЕМА ГОТОВА';
        document.title='Cyber Tetris — Synthwave Arcade';
        window.setTimeout(()=>document.body.classList.add('game-ready'),180);
      }
      function maybeReveal(){if(frameLoaded && progress>=90) reveal();}
      frame.addEventListener('load',()=>{
        frameLoaded=true;dbg('iframe load event');
        try{
          // The iframe document can load before JS-created image assets finish decoding.
          // Never force the splash to 100% here; wait for game.html's real readiness message.
          const boot=Number(frame.contentWindow?.__CYBER_BOOT_PROGRESS)||0;
          if(boot>progress){
            const safeProgress=Math.min(boot,99);
            setProgress(safeProgress,boot>=94?'ИГРОВОЕ ПОЛЕ ГОТОВО':'ДОГРУЖАЕМ ГРАФИКУ И ЭФФЕКТЫ');
          } else if(progress<90) {
            caption.textContent='ИГРОВОЕ ЯДРО ЗАГРУЖЕНО · ДОГРУЖАЕМ РЕСУРСЫ';
          }
        }catch(_){caption.textContent='ДОГРУЖАЕМ ИГРОВЫЕ РЕСУРСЫ';}
        maybeReveal();
      });
      frame.addEventListener('error',()=>{dbg('iframe load ERROR event');document.body.classList.add('load-failed');});
      window.addEventListener('error',e=>dbg('parent error: '+e.message));
      window.addEventListener('unhandledrejection',e=>dbg('parent promise: '+String(e.reason)));
      slowTimer=window.setTimeout(()=>{
        if(!ready){caption.textContent='ЗАГРУЗКА ЗАНИМАЕТ БОЛЬШЕ ОБЫЧНОГО · ПРОДОЛЖАЕМ…';document.body.classList.add('load-failed');}
      },22000);
      document.getElementById('refresh-page-btn').addEventListener('click',()=>{const url=new URL(location.href);url.searchParams.set('refresh',Date.now());location.replace(url.toString());});
      document.getElementById('copy-log-persistent').addEventListener('click',async()=>{const log=debugLines.join('\n');try{await navigator.clipboard.writeText(log);document.getElementById('copy-log-persistent').textContent='LOG COPIED';}catch(_){const area=document.createElement('textarea');area.value=log;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();try{document.execCommand('copy');document.getElementById('copy-log-persistent').textContent='LOG COPIED';}catch(__){document.getElementById('copy-log-persistent').textContent='COPY FAILED';}area.remove();}});
      document.getElementById('copy-log-btn').addEventListener('click',async()=>{const log=debugLines.join('\n');const btn=document.getElementById('copy-log-btn');try{await navigator.clipboard.writeText(log);btn.textContent='ЛОГ СКОПИРОВАН';}catch(_){const area=document.createElement('textarea');area.value=log;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();try{document.execCommand('copy');btn.textContent='ЛОГ СКОПИРОВАН';}catch(__){btn.textContent='НЕ УДАЛОСЬ СКОПИРОВАТЬ';}area.remove();}});
      document.getElementById('retry-btn').addEventListener('click',()=>{
        document.body.classList.remove('load-failed','game-ready');ready=false;frameLoaded=false;progress=7;setProgress(7,'Повторно загружаем игровые ресурсы…');
        const url=new URL('./game.html',location.href);url.searchParams.set('v','15.1.4-independent-diag');url.searchParams.set('reload',Date.now());frame.src=url.toString();
        slowTimer=window.setTimeout(()=>{if(!ready)document.body.classList.add('load-failed');},22000);
      });
    })();
  </script>
</body>
</html>
